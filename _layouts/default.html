<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ page.title }}</title>
        <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
        <!-- fixes flickering issue with logo font loading -->
        <link
            rel="preload"
            href="../fonts/warriot-tech-font/WarriotTechItalic-YqOoa.ttf"
            as="font"
            type="font/ttf"
            crossorigin
        >
    </head>

    <body>
        <div class="siteContainer">
            <!-- adds a browser bar to imitate cyberpunk 2077 browser -->
            <div class="browserBar">
                <span class="browserBrand">
                    &#8962; KEYSTONE
                </span>

                <span class="browserAddress">
                    NETDIR://3VERETT.GITHUB.IO
                </span>

                <span class="browserStatus">    
                    POWERED BY <span class=netwatch>NETWATCH</span>
                </span>
            </div>
            <header>
                <a href="/" class="siteLogo">
                    <span class="firstWord">Everett</span>
                    <span class="secondWord">Guyea</span>
                </a>
                
                <nav>
                    <a href="/about-me.html" class="navBar">About Me</a>
                    <a href="/projects.html" class="navBar">Projects</a>
                    <a href="/contact.html" class="navBar">Contact</a>
                </nav>

            </header>

            <main>
                {{ content }}
            </main>
        </div>
    </body>

</html>
