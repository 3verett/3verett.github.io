    const options = {
      width: '100%',
      height: '152', // Compact height ideal for a single song
      uri: 'spotify:track:4ypL8lKeVlFe3ZJMLcYHzK'
    };
    const callback = (EmbedController) => {};
    IFrameAPI.createController(element, options, callback);
  };
</script>
